version: "3.8"

services:
  casee-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: casee-mcp-server
    ports:
      - "8100:8100"
    # 从项目根目录 .env 注入配置（CASEE_API_KEY / CASEE_API_BASE_URL / CASEE_TIMEOUT / MCP_*）
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "from casee import __version__; print('OK')"]
      interval: 30s
      timeout: 5s
      retries: 3
