version: "3.8"

services:
  casee-mcp:
    build: .
    container_name: casee-mcp-server
    ports:
      - "8100:8100"
    environment:
      - CASEE_API_KEY=${CASEE_API_KEY:-sk_xxx}
      - CASEE_API_BASE_URL=${CASEE_API_BASE_URL:-https://casee.me}
      - CASEE_TIMEOUT=${CASEE_TIMEOUT:-30}
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8100
      - MCP_PATH=/mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "from casee import __version__; print('OK')"]
      interval: 30s
      timeout: 5s
      retries: 3